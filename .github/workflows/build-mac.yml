name: Build macOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release"]'

  build:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    name: macOS x86-64 (${{ matrix.build_type }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: brew install gcc boost

      - name: Configure
        run: |
          gcc_cxx=$(find /usr/local/bin -maxdepth 1 -name 'g++-*' | sort -V | tail -1)
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER="$gcc_cxx" \
            -DBUILD_32BIT=OFF

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"
