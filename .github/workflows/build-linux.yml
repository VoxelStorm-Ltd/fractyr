name: Build Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x86-64 (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libboost-dev \
            mold \
            libgl-dev \
            libasound2-dev \
            libx11-dev \
            libxt-dev \
            libxi-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libudev-dev \
            xxd

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_32BIT=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"
